name: Scale CV icon

on:
  push:
    paths:
      - 'cv-icon-scale-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match CV mark to profile icon scale
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('public/index.html')
          s = p.read_text()
          old = '<symbol id="icon-cv" viewBox="0 0 24 24"><text x="12" y="15.6" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="-.45">CV</text></symbol>'
          new = '<symbol id="icon-cv" viewBox="0 0 24 24"><text x="12" y="17.8" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16.5" font-weight="750" letter-spacing="-1">CV</text></symbol>'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one current CV symbol, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

          rm -f cv-icon-scale-trigger
          rm -f .github/workflows/scale-cv-icon.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Scale CV mark to profile icons'
          git push
