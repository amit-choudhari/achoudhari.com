name: Update CV icon

on:
  push:
    paths:
      - 'cv-icon-update/READY'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use text-only CV icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('public/index.html')
          s = p.read_text()
          old = '<symbol id="icon-cv" viewBox="0 0 24 24"><path d="M5.5 3.5h8l5 5v12h-13z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M13.5 3.5v5h5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><text x="12" y="16.6" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial, sans-serif" font-size="7.7" font-weight="700">CV</text></symbol>'
          new = '<symbol id="icon-cv" viewBox="0 0 24 24"><text x="12" y="15.6" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="-.45">CV</text></symbol>'
          if old not in s:
              raise SystemExit('Current CV icon symbol not found')
          p.write_text(s.replace(old, new, 1))
          PY

          rm -rf cv-icon-update
          rm -f .github/workflows/update-cv-icon.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify CV icon'
          git push
