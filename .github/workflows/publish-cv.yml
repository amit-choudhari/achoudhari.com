name: Publish CV

on:
  push:
    paths:
      - 'cv-final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish verified CV and clean staging
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/cv
          cat cv-final/chunk_* | base64 -d | gzip -d > public/cv/amit-choudhari-cv.pdf
          echo 'c0ba55efc3661a1a91e0b279b4a9b6067ce0939d872c6642dc75a28275d252cb  public/cv/amit-choudhari-cv.pdf' | sha256sum -c -

          # Rebuild from the reviewed site version and apply the final CV presentation.
          git show ee8f753d37bea79168e3b2c68ce90756dee48ad8:public/index.html > public/index.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('public/index.html')
          s = p.read_text()

          s = s.replace(
              'Available from January 2027 · Open to research and R&amp;D roles in systems, microarchitecture, and hardware security.',
              'Open to research and R&amp;D roles beginning in 2027 in systems, microarchitecture, and hardware security.'
          )

          cv_symbol = '''    <symbol id="icon-cv" viewBox="0 0 24 24"><path d="M5.5 3.5h8l5 5v12h-13z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M13.5 3.5v5h5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><text x="12" y="16.6" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial, sans-serif" font-size="7.7" font-weight="700">CV</text></symbol>\n'''
          marker = '    <symbol id="icon-slides"'
          if 'id="icon-cv"' not in s:
              s = s.replace(marker, cv_symbol + marker, 1)

          s = re.sub(
              r'(<a class="icon-link" href="/cv/amit-choudhari-cv\.pdf"[^>]*><svg class="icon"><use href=")#icon-pdf("/></svg></a>)',
              r'\1#icon-cv\2',
              s,
          )

          p.write_text(s)
          PY

          rm -rf cv-final cv-staging cv-upload3 cv-upload4 cv-upload5 deploy-staging index-staging
          rm -f cv-upload-direct-test.txt
          rm -f .github/workflows/publish-cv.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish CV and use CV icon'
          git push
